name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generator and layout tests
        run: python -m unittest discover -s tests -v

  build-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: pages-build
    steps:
      - uses: actions/checkout@v6
        with:
          path: workspace/xian-map
          persist-credentials: false
      - name: Get read-only access to xian-bridge
        id: bridge-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.XIAN_BRIDGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.XIAN_BRIDGE_APP_PRIVATE_KEY }}
          owner: xian-technology
          repositories: xian-bridge
          permission-contents: read
      - uses: actions/checkout@v6
        with:
          repository: xian-technology/xian-bridge
          ref: main
          path: workspace/xian-bridge
          token: ${{ steps.bridge-token.outputs.token }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the public map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth 1 https://github.com/xian-technology/xian-meta.git workspace/xian-meta
          git -C workspace/xian-bridge remote set-head origin main
          python -m pip install graphifyy==0.9.115
          workspace/xian-map/scripts/publish-pages.sh --ci-build "$RUNNER_TEMP/xian-map-pages"
      - uses: actions/upload-artifact@v4
        with:
          name: xian-map-pages
          path: ${{ runner.temp }}/xian-map-pages/index.html
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    concurrency: github-pages
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: xian-map-pages
          path: ${{ runner.temp }}/xian-map-pages
      - name: Publish to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          gh auth setup-git --hostname github.com
          scripts/publish-pages.sh --ci-publish "$RUNNER_TEMP/xian-map-pages/index.html"
